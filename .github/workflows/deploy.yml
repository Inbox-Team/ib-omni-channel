name: Chatwoot Flow

on:
  push:
    branches:
      - dev/nova  # Kích hoạt khi push vào nhánh dev/nova

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Sử dụng driver docker-container để hỗ trợ xuất cache 'gha'
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Info
        id: prep
        run: |
          # Chuyển tên owner và repo về chữ thường để GHCR chấp nhận
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Truyền các biến ARG vào Dockerfile để tránh lỗi 'RUN if'
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
          # Tag image theo định dạng ghcr.io/username/repo:latest
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/${{ steps.prep.outputs.repo }}:latest
          # Cấu hình Cache tối ưu cho GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-caprover:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Rails App via Webhook
        run: |
          echo "Triggering Webhook cho Rails App..."
          curl -X POST "${{ secrets.CAPROVER_WEBHOOK_WEB }}"

      - name: Deploy Sidekiq via Webhook
        run: |
          echo "Triggering Webhook cho Sidekiq Worker..."
          curl -X POST "${{ secrets.CAPROVER_WEBHOOK_SIDEKIQ }}"