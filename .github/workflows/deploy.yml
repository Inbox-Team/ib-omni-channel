name: Build and Deploy Chatwoot to GHCR

on:
  push:
    branches:
      - dev/nova 
permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ib-chatwoot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-caprover:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Rails App via Webhook
        run: curl -X POST "${{ secrets.CAPROVER_WEBHOOK_WEB }}"

      - name: Deploy Sidekiq via Webhook
        run: curl -X POST "${{ secrets.CAPROVER_WEBHOOK_SIDEKIQ }}"