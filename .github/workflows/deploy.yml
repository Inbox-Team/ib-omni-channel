name: Deploy Chatwoot Fork

on:
  push:
    branches: [ "dev/nova" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Quan trọng: Truyền build-args để Dockerfile nhận diện đúng môi trường
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
          tags: ghcr.io/${{ github.repository_owner }}/ib-chatwoot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CapRover Webhook
        run: |
          curl -X POST "${{ secrets.CAPROVER_WEBHOOK_WEB }}"
          curl -X POST "${{ secrets.CAPROVER_WEBHOOK_SIDEKIQ }}"