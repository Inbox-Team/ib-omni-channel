name: Build and Deploy Chatwoot to CapRover

on:
  push:
    branches:
      - dev/nova 

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: prep
        run: |
          echo "owner=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "repo=${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          build-args: |
            RAILS_ENV=production
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/ib-chatwoot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-caprover:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Apps via Webhook
        run: |
          echo "Deploying Rails App..."
          curl -X POST "${{ secrets.CAPROVER_WEBHOOK_WEB }}"
          echo "Deploying Sidekiq..."
          curl -X POST "${{ secrets.CAPROVER_WEBHOOK_SIDEKIQ }}"